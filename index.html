<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mialatossino - O Império 🎰</title>
    <style>
        :root { --gold: #f1c40f; --blue: #3498db; --red: #e74c3c; --dark: #070b14; --card: #161b22; --green: #2ecc71; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; text-align: center; margin: 0; padding-bottom: 50px; }
        
        .header { background: var(--card); padding: 15px; border-bottom: 2px solid var(--gold); font-size: 1.5rem; color: var(--gold); position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-around; align-items: center; }
        .logo { font-size: 3.5rem; font-weight: 900; background: linear-gradient(to bottom, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 20px 0; }
        .btn-game { background: var(--card); border: 2px solid #30363d; color: white; padding: 20px; width: 280px; font-size: 1.1rem; border-radius: 15px; cursor: pointer; transition: 0.3s; margin: 10px; font-weight: bold; }
        .btn-game:hover { border-color: var(--gold); transform: translateY(-3px); box-shadow: 0 0 15px var(--gold); }

        .modal-card { background: var(--card); max-width: 900px; margin: 20px auto; padding: 25px; border-radius: 20px; border: 2px solid var(--gold); display: none; }

        /* MAPA EM CÓDIGO (SVG FIX) */
        .map-frame { position: relative; width: 100%; height: 400px; margin: 15px auto; border: 2px solid #30363d; border-radius: 15px; background: #001a33; overflow: hidden; }
        .svg-map { width: 100%; height: 100%; opacity: 0.3; }
        
        .map-target { 
            position: absolute; width: 45px; height: 45px; background: rgba(0, 0, 0, 0.8); 
            border: 2px solid var(--gold); border-radius: 50%; cursor: pointer; 
            transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center;
            transition: 0.3s; font-size: 10px; color: #fff; font-weight: bold; z-index: 10;
        }
        .map-target:hover { background: var(--red); scale: 1.2; }

        /* BONEQUINHOS */
        #stage { width: 95%; max-width: 750px; height: 320px; background: #000; margin: 20px auto; position: relative; border-radius: 20px; border: 3px solid #30363d; display: none; overflow: hidden; }
        .lane { height: 50%; border-bottom: 1px dashed #333; }
        .sprite { position: absolute; width: 50px; height: 100px; bottom: 20px; }
        .head { width: 25px; height: 25px; background: #ffdbac; border-radius: 50%; margin: 0 auto; border: 1px solid #000; }
        .body { width: 10px; height: 40px; background: white; margin: 0 auto; position: relative; border-radius: 5px; }
        .arm { position: absolute; width: 22px; height: 7px; background: white; top: 10px; border-radius: 3px; }
        .p1 .body, .p1 .arm { background: var(--blue); }
        .p2 .body, .p2 .arm { background: var(--red); }
        .hp-outer { width: 60px; height: 8px; background: #222; position: absolute; top: -25px; left: -5px; border-radius: 4px; border: 1px solid #444; }
        .hp-inner { height: 100%; background: var(--green); width: 100%; }
        
        .btn-main { background: var(--gold); color: #000; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.1rem; }
        .punch .arm { transform: scaleX(2.5); background: #fff !important; }
        .run-anim { animation: runShake 0.2s infinite; }
        @keyframes runShake { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        input, select { width: 95%; padding: 12px; margin: 8px 0; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 10px; }
        .carreira-box { text-align: left; background: #0d1117; padding: 15px; border-radius: 10px; margin-top: 15px; border-left: 5px solid var(--gold); line-height: 1.6; }
    </style>
</head>
<body>

    <div class="header">
        <div>💰 $<span id="saldo">1000</span></div>
        <button onclick="openModal('shop')" style="background:var(--gold); border:none; padding:8px 15px; border-radius:10px; cursor:pointer; font-weight:bold;">⚙️ OPÇÕES / CÓDIGOS</button>
    </div>

    <div id="menu" class="hero">
        <div class="logo">MIALATOSSINO 🎰</div>
        <button class="btn-game" onclick="openModal('maduro-game')" style="background:#8b0000; color:white;">🇻🇪 MADURO SIMULATOR</button>
        <button class="btn-game" onclick="openModal('setup-luta')">🥊 BOXE / CORRIDA</button>
        <button class="btn-game" onclick="openModal('career')" style="background:#1e5128; color:white;">⚽ CARREIRA PRO</button>
        <button class="btn-game" onclick="openModal('hitler')" style="background:#2d1b4d; color:white;">⚡ HITLER (100K)</button>
    </div>

    <div id="maduro-game" class="modal-card">
        <h3>🌍 Geopolítica Mialatossino</h3>
        <div id="config-pais">
            <input type="text" id="m-nome-pais" placeholder="Nome da sua Nação">
            <button class="btn-main" onclick="fundarPais()">FUNDAR ESTADO</button>
        </div>
        <div id="painel-controle" style="display:none;">
            <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:5px; margin-bottom:10px;">
                <div style="background:#0d1117; padding:5px; border-radius:5px;">PIB: <span id="m-pib" style="color:var(--gold)">1000</span></div>
                <div style="background:#0d1117; padding:5px; border-radius:5px;">EX: <span id="m-ex" style="color:var(--gold)">100</span></div>
                <div style="background:#0d1117; padding:5px; border-radius:5px;">😊: <span id="m-happy" style="color:var(--gold)">50%</span></div>
                <div style="background:#0d1117; padding:5px; border-radius:5px;">St: <span id="m-st">Presidente</span></div>
            </div>
            <select id="m-tipo-acao"><option value="GUERRA">INVASÃO ($200)</option><option value="ALIANCA">ALIANÇA ($200)</option></select>
            
            <div class="map-frame">
                <svg class="svg-map" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
                    <rect width="800" height="400" fill="#001a33"/>
                    <path d="M150,100 Q200,80 250,120 T350,100" stroke="#3498db" fill="none" stroke-width="2"/>
                    <circle cx="200" cy="150" r="80" fill="#222"/> <circle cx="250" cy="280" r="60" fill="#222"/> <circle cx="450" cy="120" r="70" fill="#222"/> <circle cx="480" cy="250" r="60" fill="#222"/> <circle cx="650" cy="300" r="40" fill="#222"/> </svg>

                <div class="map-target" style="top:30%; left:20%" onclick="mInteragir('EUA', 95)">USA</div>
                <div class="map-target" style="top:65%; left:30%" onclick="mInteragir('BRASIL', 40)">BRA</div>
                <div class="map-target" style="top:25%; left:60%" onclick="mInteragir('RUSSIA', 85)">RUS</div>
                <div class="map-target" style="top:45%; left:75%" onclick="mInteragir('CHINA', 90)">CHN</div>
                <div class="map-target" style="top:35%; left:48%" onclick="mInteragir('EUROPA', 65)">EUR</div>
                <div class="map-target" style="top:55%; left:72%" onclick="mInteragir('INDIA', 70)">IND</div>
                <div class="map-target" style="top:75%; left:35%" onclick="mInteragir('ARGENTINA', 35)">ARG</div>
                <div class="map-target" style="top:80%; left:85%" onclick="mInteragir('AUS', 55)">AUS</div>
                <div class="map-target" style="top:52%; left:15%" onclick="mInteragir('MEXICO', 45)">MEX</div>
                <div class="map-target" style="top:50%; left:85%" onclick="mInteragir('JAPAO', 60)">JPN</div>
            </div>
            <div id="m-log" style="font-family:monospace; color:#0f0; background:#000; padding:10px; font-size:11px; text-align:left; height:50px; overflow-y:auto;">> Radar Mialatossino Ativo...</div>
        </div>
        <button onclick="closeModals()" class="btn-main" style="background:#444; color:white; margin-top:10px;">VOLTAR</button>
    </div>

    <div id="career" class="modal-card">
        <h3>⚽ Agenciamento Profissional</h3>
        <input type="text" id="cj-nome" placeholder="Nome">
        <input type="text" id="cj-sel" placeholder="Seleção">
        <select id="cj-pos">
            <option value="Goleiro">Goleiro</option>
            <option value="Zagueiro">Zagueiro</option>
            <option value="Lateral">Lateral</option>
            <option value="Meia">Meio-Campo</option>
            <option value="Ponta">Ponta</option>
            <option value="Centroavante">Centroavante</option>
        </select>
        <button class="btn-main" onclick="genCareer()">INVESTIR $500</button>
        <div id="career-res" style="display:none" class="carreira-box"></div>
    </div>

    <div id="setup-luta" class="modal-card">
        <h3>🥊 Duelo de Stickmen</h3>
        <input type="text" id="n1" placeholder="Famoso 1"><input type="text" id="n2" placeholder="Famoso 2">
        <input type="number" id="p1" placeholder="Peso 1 (kg)"><input type="number" id="p2" placeholder="Peso 2 (kg)">
        <select id="g-mode"><option value="boxe">Boxe</option><option value="corrida">Corrida</option></select>
        Apostar em: <select id="bOn"><option value="1">1</option><option value="2">2</option></select>
        Aposta: $<input type="number" id="bVal" value="100">
        <button class="btn-main" onclick="playGame()">INICIAR</button>
    </div>

    <div id="hitler" class="modal-card"><input type="text" id="hIn" placeholder="QUEM VENCE?"><button class="btn-main" onclick="playHitler()">APOSTAR $100</button></div>
    <div id="shop" class="modal-card"><input type="text" id="cheat" placeholder="Código..."><button class="btn-main" onclick="useCheat()">EXECUTAR</button></div>

    <div id="stage">
        <div id="track-bg" style="display:none; height:100%"><div class="lane"></div><div class="lane"></div><div class="finish"></div></div>
        <div id="s1" class="sprite p1" style="left:50px"><div class="hp-outer"><div id="h1" class="hp-inner"></div></div><div class="head"></div><div class="body"><div class="arm" style="left:8px"></div></div><span id="nt1" style="font-size:10px; position:absolute; bottom:-20px; width:100px; left:-25px"></span></div>
        <div id="s2" class="sprite p2" style="right:50px"><div class="hp-outer"><div id="h2" class="hp-inner"></div></div><div class="head"></div><div class="body"><div class="arm" style="right:8px"></div></div><span id="nt2" style="font-size:10px; position:absolute; bottom:-20px; width:100px; left:-25px"></span></div>
    </div>
    <h1 id="msg"></h1>
    <button id="btn-next" onclick="location.reload()" style="display:none; padding:15px; background:var(--gold); border:none; border-radius:10px; font-weight:bold; margin: 20px auto; cursor:pointer">MENU 🏠</button>

    <script>
        let balance = 1000, pStats = { pib:1000, ex:100, happy:50 };
        function openModal(id) { document.querySelectorAll('.modal-card').forEach(m => m.style.display='none'); document.getElementById('menu').style.display='none'; document.getElementById(id).style.display='block'; }
        function closeModals() { document.querySelectorAll('.modal-card').forEach(m => m.style.display='none'); document.getElementById('menu').style.display='block'; }
        function useCheat() { let c = document.getElementById('cheat').value; if(c === "QUINELATO") { balance = 9999999; alert("💰!"); } else if(c === "ROBINHO") { alert("RAPHA NAO VAI TER DICAS PRO BETINHA"); } document.getElementById('saldo').innerText = balance; }
        function playHitler() { if(balance < 100) return; balance -= 100; const w = ["PELE", "ROBINHO", "NEYMAR", "STALIN", "KID BENGALA", "CAÇA RATO", "BOLSONARO", "VIRGENS", "TADALAFELAS", "CRIADOR DO GUARANI"]; if(w.includes(document.getElementById('hIn').value.toUpperCase())) { balance += 100000; alert("💰!"); } else alert("❌!"); document.getElementById('saldo').innerText = balance; }
        function fundarPais() { if(!document.getElementById('m-nome-pais').value) return; document.getElementById('config-pais').style.display = 'none'; document.getElementById('painel-controle').style.display = 'block'; }
        
        function mInteragir(alvo, def) {
            if(balance < 200) return alert("Precisa de $200!");
            balance -= 200;
            const acao = document.getElementById('m-tipo-acao').value;
            if(acao === "GUERRA") {
                if(Math.random() < (pStats.ex/(pStats.ex+def)+0.1)) { balance += (def*70); pStats.pib += (def*15); pStats.ex += 20; document.getElementById('m-log').innerText = `> VITÓRIA EM ${alvo}! +$${def*70}`; }
                else { pStats.ex -= 25; pStats.happy -= 15; document.getElementById('m-log').innerText = `> DERROTA EM ${alvo}`; }
            } else { pStats.happy += 15; pStats.ex += 15; document.getElementById('m-log').innerText = `> ALIANÇA COM ${alvo}`; }
            document.getElementById('m-pib').innerText = pStats.pib; document.getElementById('m-happy').innerText = pStats.happy+"%"; document.getElementById('m-ex').innerText = Math.floor(pStats.ex); document.getElementById('saldo').innerText = balance.toFixed(2);
        }

        function genCareer() {
            if(balance < 500) return; balance -= 500;
            const nome = document.getElementById('cj-nome').value.toUpperCase(), sel = document.getElementById('cj-sel').value || "Brasil", pos = document.getElementById('cj-pos').value;
            const times = ["Santos", "Real Madrid", "Vasco", "Bayern", "PSG", "Man City", "Íbis"];
            const tPool = ["Copa do Mundo", "Champions", "Libertadores", "Bola de Ouro", "Copa do Brasil"];
            let g = Math.floor(Math.random()*700), a = Math.floor(Math.random()*300), t = tPool.filter(()=>Math.random()>0.7).join(", ") || "Troféu do Bairro";
            let lucro = g > 500 ? 3000 : (g > 200 ? 1000 : 0); balance += lucro;
            document.getElementById('career-res').innerHTML = `<b>NOME:</b> ${nome} | <b>SELEÇÃO:</b> ${sel}<br><b>POSIÇÃO:</b> ${pos}<br><b>BASE:</b> ${times[Math.floor(Math.random()*7)]} | <b>AUGE:</b> ${times[Math.floor(Math.random()*7)]}<br><b>TÍTULOS:</b> ${t}<br><b>GOLS:</b> ${g} | <b>LUCRO:</b> $${lucro > 0 ? '+'+lucro : '-500'}`;
            document.getElementById('career-res').style.display = 'block'; document.getElementById('saldo').innerText = balance;
        }

        function playGame() {
            const v = parseFloat(document.getElementById('bVal').value); if(v > balance) return; balance -= v; document.getElementById('saldo').innerText = balance;
            const m = document.getElementById('g-mode').value; document.getElementById('setup-luta').style.display = 'none'; document.getElementById('stage').style.display = 'block';
            let g1_p = {hp:100, pos:50}, g2_p = {hp:100, pos:50}; document.getElementById('nt1').innerText = document.getElementById('n1').value || "P1"; document.getElementById('nt2').innerText = document.getElementById('n2').value || "P2";
            const s1 = document.getElementById('s1'), s2 = document.getElementById('s2');
            if(m === 'corrida') { document.getElementById('track-bg').style.display = 'block'; s1.style.top = "50px"; s2.style.top = "200px"; s1.classList.add('run-anim'); s2.classList.add('run-anim'); s2.style.right = "auto"; s2.style.left = "50px"; } else { s2.style.right = "50px"; }
            let loop = setInterval(() => {
                if(m === 'boxe') { if(g1_p.pos < 300) { g1_p.pos += 10; s1.style.left = g1_p.pos+"px"; } let r2 = parseInt(getComputedStyle(s2).right); if(r2 < 300) { s2.style.right = (r2+10)+"px"; } if(g1_p.pos >= 300) { g2_p.hp -= Math.random()*5; g1_p.hp -= Math.random()*5; s1.classList.toggle('punch'); s2.classList.toggle('punch'); }
                } else { g1_p.pos += Math.random()*15; g2_p.pos += Math.random()*15; s1.style.left = g1_p.pos+"px"; s2.style.left = g2_p.pos+"px"; }
                document.getElementById('h1').style.width = g1_p.hp+"%"; document.getElementById('h2').style.width = g2_p.hp+"%";
                if(g1_p.hp<=0 || g2_p.hp<=0 || g1_p.pos >= 680 || g2_p.pos >= 680) { clearInterval(loop); document.getElementById('msg').innerText = "FIM!"; document.getElementById('saldo').innerText = balance; document.getElementById('btn-next').style.display = 'block'; }
            }, 80);
        }
    </script>
</body>
</html>
